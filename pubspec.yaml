name: quanht_auto_dropper
description: "A lightweight library that intelligently adjusts dropdown positioning to ensure it remains fully visible by opening either above or below the trigger button based on available space."
version: 0.0.1

repository: https://github.com/trungquan2k/quanht_auto_dropper

issue_tracker: https://github.com/trungquan2k/quanht_auto_dropper/issues
documentation: https://github.com/trungquan2k/quanht_auto_dropper

environment:
  sdk: ^3.6.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
